# Builds the Nintendo Switch homebrew packages (.nro in zip archives) using devkitPro's
# official devkita64 Docker image.
#
# No commercial ROMs or copyright game code are embedded; tables contain addresses and symbols only.
# Manual run: Actions tab -> Nintendo Switch builds -> Run workflow.
name: Nintendo Switch builds

on:
  push:
    branches: [ main ]
    tags: [ 'v*', 'beta*' ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Package to build'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'bw'
          - 'platinum'
          - 'everything'

permissions:
  contents: write

jobs:
  switch-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git python3

      - name: Build all-in-one NoSplitNX (nosplitnx.nro)
        if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'everything'
        run: |
          bash tools/switch/build_game.sh all

      - name: Build standalone Black & White / Black 2 & White 2
        if: github.event.inputs.target == 'bw' || github.event.inputs.target == 'everything'
        run: |
          bash tools/switch/build_game.sh bw

      - name: Build standalone Platinum
        if: github.event.inputs.target == 'platinum' || github.event.inputs.target == 'everything'
        run: |
          bash tools/switch/build_game.sh platinum

      - name: Upload NoSplitNX package
        if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'everything'
        uses: actions/upload-artifact@v4
        with:
          name: nosplitnx-switch
          path: |
            build-sd/nosplitnx-switch.zip
            build-sd/SHA256SUMS.txt
          if-no-files-found: warn

      - name: Upload standalone Black & White 1 & 2 NROs
        if: github.event.inputs.target == 'bw' || github.event.inputs.target == 'everything'
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-bw-standalone-switch
          path: |
            build-sd/pokemon-black2-white2-wide-switch.zip
            build-sd/pokemon-black-white-wide-switch.zip
          if-no-files-found: warn

      - name: Upload standalone Platinum NRO
        if: github.event.inputs.target == 'platinum' || github.event.inputs.target == 'everything'
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-platinum-standalone-switch
          path: build-sd/pokemon-platinum-wide-switch.zip
          if-no-files-found: warn

      - name: Generate Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cat << EOF > build-sd/RELEASE_NOTES.md
          # NoSplitNX ${{ github.ref_name }}

          Clean baseline release of **NoSplitNX** for Nintendo Switch, combining all recent upstream improvements with Switch-specific 3D pipeline stability fixes, fast-forward synchronisation, indoor widescreen handling, texture upload caching, and the redesigned Tico/Horizon OS interface.

          ### Fast-Forward & 3D Pipeline Stability
          - **Thread-safe polygon list handoff**: Protected `Cur` and `Prev` pointer updates inside `ListHelper::Start`'s mutex, resolving the race condition crash when activating fast-forward.
          - **deko3D texture atlas reset sync**: Resynchronises `UploadedY` and `UploadedX` when the 2048x2048 texture atlas fills up and resets during fast-forward scene transitions.
          - **Steady GPU render targets & 720p slot floor**: Keeps `deko3D` render target resolution steady across fast-forward and pre-allocates slot buffers to 720p capacity so zero-copy `Wide.Front` buffers are never destroyed while in use.
          - **Synchronised fast-forward audio**: Compresses audio batches during fast-forward so sound effects stay aligned without accumulating lag.

          ### Switch Rendering & Performance Fixes
          - **Weather & edge upload caching**: Unified weather particle textures into `WeatherTex[0]` and added 64-bit FNV-1a signature caching (`weatherSig`, `edgeSig`, `narrowSig`, `fillSig`) in `GpuCompositor`, avoiding redundant `SDL_UpdateTexture` transfers on unchanged frames.
          - **Indoor void & room edges**: Expanded `MergedFillWideHoles` across the full widescreen canvas and restored `isIndoorScene()` with soft ambient side bars while keeping `sc.wide` active so `Wide.Owner` never expires indoors.
          - **Battle cursor**: Automatically clears the right-stick touch crosshair (`cursorShownUntil = 0`) as soon as D-pad or face buttons are pressed in battle.
          - **Core 1 / Core 2 balancing & GPU pause dimming**: Assigned `ListHelper` to Core 2 and `WideGpuSend` to Core 1, restricted Switch SDL joystick polling to player 1, and offloaded pause-menu backdrop dimming to hardware `SDL_RenderFillRect`.

          ### Redesigned Tico / Horizon OS Interface
          - **Glass Hero Showcase Banner**: Full-width frosted glass banner with colour-coded platform pill, serial badge, save status pill, and library counter (`1 / N`).
          - **Framed Emblem Game Cards**: Recessed glass emblem wells with console-themed radial glow, save status LED indicator, and frosted card footers with game title and serial code.
          - **Touch Drag Protection**: Scrolling the game list or settings by touch never triggers an accidental selection on release.

          ### Installation & Updating
          - **From console:** Open \`SETTINGS (Y)\` -> \`CHECK FOR UPDATES\` and press \`A\` to install.
          - **Manual install:** Extract \`nosplitnx-switch.zip\` to the root of your microSD card (\`sdmc:/switch/nosplitnx/nosplitnx.nro\`) and place your ROMs in \`sdmc:/switch/nosplitnx/roms/\`.
          EOF
          echo "" >> build-sd/RELEASE_NOTES.md
          echo "### Checksums (\`SHA256SUMS.txt\`)" >> build-sd/RELEASE_NOTES.md
          echo "\`\`\`text" >> build-sd/RELEASE_NOTES.md
          cat build-sd/SHA256SUMS.txt >> build-sd/RELEASE_NOTES.md
          echo "\`\`\`" >> build-sd/RELEASE_NOTES.md

      - name: Create GitHub Release for Beta Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: "NoSplitNX ${{ github.ref_name }}"
          body_path: build-sd/RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            build-sd/nosplitnx-switch.zip
            build-sd/SHA256SUMS.txt
