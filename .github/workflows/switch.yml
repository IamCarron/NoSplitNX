# Builds the Nintendo Switch homebrew packages (.nro in zip archives) using devkitPro's
# official devkita64 Docker image.
#
# No commercial ROMs or copyright game code are embedded; tables contain addresses and symbols only.
# Manual run: Actions tab -> Nintendo Switch builds -> Run workflow.
name: Nintendo Switch builds

on:
  push:
    branches: [ main ]
    tags: [ 'v*', 'beta*' ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Package to build'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'bw'
          - 'platinum'
          - 'everything'

permissions:
  contents: write

jobs:
  switch-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git python3

      - name: Build all-in-one NoSplitNX (nosplitnx.nro)
        if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'everything'
        run: |
          bash tools/switch/build_game.sh all

      - name: Build standalone Black & White / Black 2 & White 2
        if: github.event.inputs.target == 'bw' || github.event.inputs.target == 'everything'
        run: |
          bash tools/switch/build_game.sh bw

      - name: Build standalone Platinum
        if: github.event.inputs.target == 'platinum' || github.event.inputs.target == 'everything'
        run: |
          bash tools/switch/build_game.sh platinum

      - name: Upload NoSplitNX package
        if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'everything'
        uses: actions/upload-artifact@v4
        with:
          name: nosplitnx-switch
          path: |
            build-sd/nosplitnx-switch.zip
            build-sd/SHA256SUMS.txt
          if-no-files-found: warn

      - name: Upload standalone Black & White 1 & 2 NROs
        if: github.event.inputs.target == 'bw' || github.event.inputs.target == 'everything'
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-bw-standalone-switch
          path: |
            build-sd/pokemon-black2-white2-wide-switch.zip
            build-sd/pokemon-black-white-wide-switch.zip
          if-no-files-found: warn

      - name: Upload standalone Platinum NRO
        if: github.event.inputs.target == 'platinum' || github.event.inputs.target == 'everything'
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-platinum-standalone-switch
          path: build-sd/pokemon-platinum-wide-switch.zip
          if-no-files-found: warn

      - name: Generate Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cat << EOF > build-sd/RELEASE_NOTES.md
          # NoSplitNX ${{ github.ref_name }}

          This release delivers a comprehensive visual and UX overhaul of the entire application: the Game Launcher, In-Game Pause Menu, Settings Page, and In-Game HUD now feature a modern Horizon OS glassmorphism design with tactile 3D controller button badges, radiant glow highlights, physical retro cartridge shells, and adaptive responsive grid layout.

          ### Visual & UX Overhaul

          - **Dynamic Responsive Grid**: Eliminated the 4-column clamp on 1080p, 1440p, 4K, and ultra-wide displays; balanced horizontal and vertical card spacing uniformly; adaptive 2-column portrait layout for vertical screens.
          - **Tactile Physical Cartridge Cases**: When custom box art is absent, rendered a detailed 3D retro cartridge case (Nintendo DS matte dark charcoal with grip arrow/notch or GBA slate with curved lip relief), complete with metallic label sticker, platform header, crisp 32x32 scaled pixel icon, and authentic serial code (\`NTR-\` / \`AGB-\`).
          - **Frosted Glass Cards & Radiant Glow**: Added multi-layer radiant bloom glow to focused cards, tabs, and buttons; soft ambient drop shadows; rounded top corners on cover art matching card geometry.
          - **Glowing Hardware LED Status Indicators**: Replaced plain text status with realistic illuminated LED dots (emerald for save found, amber for new game, ruby for unsupported, violet for coming soon) and luminous glass status capsules.
          - **Tactile Controller Button Badges Dock**: Replaced plain text button hints with physical 3D beveled controller button badges \`[A] PLAY\`, \`[Y] SETTINGS\`, \`[X] RANDOM\`, \`[L] [R] TABS\`, \`[+] QUIT\` in both launcher and settings pages, as well as top header buttons \`[< BACK (B)]\` and \`[SETTINGS (Y)]\`.
          - **Horizon OS Sliding Toggle Switches & Slider Bars**: Upgraded settings page and in-game pause menu with modern sliding switches, smooth continuous volume slider bars with circular thumb knobs, and frosted glass panels with subtle cinematic perimeter vignetting.
          - **In-Game HUD Glassmorphism**: Sleek frosted glass capsules for the FPS counter and fast-forward indicator (\`>>\`) with glowing status dots, and modernized notification toasts with luminous accent stripes.
          - **Vibrant Color Palette**: Overhauled accent themes with 8 rich high-contrast colors (Crimson Red, Electric Azure, Emerald Mint, Cosmic Amethyst, Sunset Amber, Coral Pink, Aqua Teal, Platinum Silver).

          ### Stability & Rendering (from Beta 7)
          - Door exit and map transition stability with stack buffer overflow fix in polygon clipping.
          - Candidate search stall elimination when loading outdoor overworld maps.
          - Safe 60 FPS motion interpolation toggle mid-dialogue.

          ### Installation & Updating

          - **From console:** Open \`SETTINGS (Y)\` -> \`CHECK FOR UPDATES\` and press \`A\` to install.
          - **Manual install:** Extract \`nosplitnx-switch.zip\` to the root of your microSD card (\`sdmc:/switch/nosplitnx/nosplitnx.nro\`) and place your ROMs in \`sdmc:/switch/nosplitnx/roms/\`.
          EOF
          echo "" >> build-sd/RELEASE_NOTES.md
          echo "### Checksums (\`SHA256SUMS.txt\`)" >> build-sd/RELEASE_NOTES.md
          echo "\`\`\`text" >> build-sd/RELEASE_NOTES.md
          cat build-sd/SHA256SUMS.txt >> build-sd/RELEASE_NOTES.md
          echo "\`\`\`" >> build-sd/RELEASE_NOTES.md

      - name: Create GitHub Release for Beta Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: "NoSplitNX ${{ github.ref_name }}"
          body_path: build-sd/RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            build-sd/nosplitnx-switch.zip
            build-sd/SHA256SUMS.txt
