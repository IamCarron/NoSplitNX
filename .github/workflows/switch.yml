# Builds the Nintendo Switch homebrew packages (.nro in zip archives) using devkitPro's
# official devkita64 Docker image.
#
# No commercial ROMs or copyright game code are embedded; tables contain addresses and symbols only.
# Manual run: Actions tab -> Nintendo Switch builds -> Run workflow.
name: Nintendo Switch builds

on:
  push:
    branches: [ main ]
    tags: [ 'v*', 'beta*' ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Package to build'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'bw'
          - 'platinum'
          - 'everything'

permissions:
  contents: write

jobs:
  switch-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git python3

      - name: Build all-in-one NoSplitNX (nosplitnx.nro)
        if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'everything'
        run: |
          bash tools/switch/build_game.sh all

      - name: Build standalone Black & White / Black 2 & White 2
        if: github.event.inputs.target == 'bw' || github.event.inputs.target == 'everything'
        run: |
          bash tools/switch/build_game.sh bw

      - name: Build standalone Platinum
        if: github.event.inputs.target == 'platinum' || github.event.inputs.target == 'everything'
        run: |
          bash tools/switch/build_game.sh platinum

      - name: Upload NoSplitNX package
        if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'everything'
        uses: actions/upload-artifact@v4
        with:
          name: nosplitnx-switch
          path: |
            build-sd/nosplitnx-switch.zip
            build-sd/SHA256SUMS.txt
          if-no-files-found: warn

      - name: Upload standalone Black & White 1 & 2 NROs
        if: github.event.inputs.target == 'bw' || github.event.inputs.target == 'everything'
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-bw-standalone-switch
          path: |
            build-sd/pokemon-black2-white2-wide-switch.zip
            build-sd/pokemon-black-white-wide-switch.zip
          if-no-files-found: warn

      - name: Upload standalone Platinum NRO
        if: github.event.inputs.target == 'platinum' || github.event.inputs.target == 'everything'
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-platinum-standalone-switch
          path: build-sd/pokemon-platinum-wide-switch.zip
          if-no-files-found: warn

      - name: Generate Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cat << EOF > build-sd/RELEASE_NOTES.md
          # NoSplitNX ${{ github.ref_name }}

          Nintendo Switch release of **NoSplitNX** with authentic Wii U / Nintendo 3DS / DSi Plaza redesign, resolution scaling, fast-forward stability fixes, and outdoor performance improvements.

          ### Fast-Forward & Pipeline Stability Fixes
          - **Eliminated crash on fast-forward release**: Pre-allocated all `deko3D` targets to 720p at startup in `Init`, eliminated runtime `FreeTargets()` destruction of GPU memory blocks, and restricted pitch-linear targets strictly to 1280x720.
          - **Resolution transition debounce**: Reset frame window counters on fast-forward transitions so releasing fast-forward does not trigger a false resolution drop.
          - **Frame-ahead race condition fix**: Synchronised `KeepLater()` copies prior to kicking `emuThread` during multi-frame fast-forward batches, preventing frame corruption.
          - **Hardware 3D line drain elimination**: Added `NeedsScanlineDrain()` to skip line-0 GPU sync stalls during hidden fast-forward frames.

          ### Performance & Audio Fixes in Heavy Scenes
          - **Duplicate 3D frame skip**: Implemented `RenderFrameIdentical` check in `WideGpuDSRenderer`, skipping redundant GPU passes on 30 FPS overworld frames.
          - **Fast-forward 360p GPU rendering**: Enabled `ffLowRes` on GPU rendering, cutting pixel shading and SDL texture upload overhead by 4x during fast-forward.
          - **Audio queue slowdown in fast-forward**: Maintained audio stretching across fast-forward to prevent SDL audio buffer starvation and sound stuttering.

          ### Wii U / Nintendo 3DS / DSi Plaza Redesign
          - **Dynamic Screen Scaling**: Cards dynamically expand (`348x324` px for 1–3 games) to fill the 1280x720 display without awkward empty voids.
          - **Physical Cartridge Silhouette & Sticker Frame**: 32x32 ROM icons (including Black/White's native checkerboard icon) are set in authentic silver/white printed sticker frames on molded DS/GBA/3DS cartridge shells with gold PCB pins.
          - **Nintendo 3DS / DSi Upper Showcase**: Upper screen with stereo speaker grilles, 3D floating cartridge showcase, animated equalizer audio waves, and interactive launch dock.
          - **Wii U / 3DS Plaza Backdrop**: Animated 3D translucent floating plaza cubes and cyan 3DS corner focus brackets.
          - **Header Overlap & Menu Polish**: Removed overlapping `[Y] AJUSTES` button on the battery/clock widget, added `NoSplitNX` header emblem, and localized pause menu footer.

          ### Installation & Updating
          - **From console:** Open \`SETTINGS (Y)\` -> \`CHECK FOR UPDATES\` and press \`A\` to install.
          - **Manual install:** Extract \`nosplitnx-switch.zip\` to the root of your microSD card (\`sdmc:/switch/nosplitnx/nosplitnx.nro\`) and place your ROMs in \`sdmc:/switch/nosplitnx/roms/\`.
          EOF
          echo "" >> build-sd/RELEASE_NOTES.md
          echo "### Checksums (\`SHA256SUMS.txt\`)" >> build-sd/RELEASE_NOTES.md
          echo "\`\`\`text" >> build-sd/RELEASE_NOTES.md
          cat build-sd/SHA256SUMS.txt >> build-sd/RELEASE_NOTES.md
          echo "\`\`\`" >> build-sd/RELEASE_NOTES.md

      - name: Create GitHub Release for Beta Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: "NoSplitNX ${{ github.ref_name }}"
          body_path: build-sd/RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            build-sd/nosplitnx-switch.zip
            build-sd/SHA256SUMS.txt
