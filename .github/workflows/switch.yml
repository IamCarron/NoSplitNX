# Builds the Nintendo Switch homebrew packages (.nro in zip archives) using devkitPro's
# official devkita64 Docker image.
#
# No commercial ROMs or copyright game code are embedded; tables contain addresses and symbols only.
# Manual run: Actions tab -> Nintendo Switch builds -> Run workflow.
name: Nintendo Switch builds

on:
  push:
    branches: [ main ]
    tags: [ 'v*', 'beta*' ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Package to build'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'bw'
          - 'platinum'
          - 'everything'

permissions:
  contents: write

jobs:
  switch-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git python3

      - name: Build all-in-one NoSplitNX (nosplitnx.nro)
        if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'everything'
        run: |
          bash tools/switch/build_game.sh all

      - name: Build standalone Black & White / Black 2 & White 2
        if: github.event.inputs.target == 'bw' || github.event.inputs.target == 'everything'
        run: |
          bash tools/switch/build_game.sh bw

      - name: Build standalone Platinum
        if: github.event.inputs.target == 'platinum' || github.event.inputs.target == 'everything'
        run: |
          bash tools/switch/build_game.sh platinum

      - name: Upload NoSplitNX package
        if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'everything'
        uses: actions/upload-artifact@v4
        with:
          name: nosplitnx-switch
          path: |
            build-sd/nosplitnx-switch.zip
            build-sd/SHA256SUMS.txt
          if-no-files-found: warn

      - name: Upload standalone Black & White 1 & 2 NROs
        if: github.event.inputs.target == 'bw' || github.event.inputs.target == 'everything'
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-bw-standalone-switch
          path: |
            build-sd/pokemon-black2-white2-wide-switch.zip
            build-sd/pokemon-black-white-wide-switch.zip
          if-no-files-found: warn

      - name: Upload standalone Platinum NRO
        if: github.event.inputs.target == 'platinum' || github.event.inputs.target == 'everything'
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-platinum-standalone-switch
          path: build-sd/pokemon-platinum-wide-switch.zip
          if-no-files-found: warn

      - name: Generate Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cat << EOF > build-sd/RELEASE_NOTES.md
          # NoSplitNX ${{ github.ref_name }}

          Nintendo Switch release of **NoSplitNX** focusing on Switch Lite handheld UI legibility and true fast-forward speedup in the overworld.

          ### Switch Lite Handheld UI Scaling & Legibility Overhaul
          - **In-game pause menu scale-up**: Enlarged menu options from 21px to 27px, row spacing from 36px to 45px, card width from 600px to 780px (~61% of display), header title to 33px, and hints to 21px for crystal clear readability on 5.5" handheld screens.
          - **Settings page full-scale rendering**: Eliminated 2/3 downsampling (`ts` now full scale 3), increasing option titles to 24px, descriptions to 18px, and panel width to 1020px.
          - **Launcher elements scale-up**: Category tabs scaled to 39px height with 16px font, top showcase title to 27px, cartridge card titles to 21-24px, and dock buttons to 36px with 16px font.

          ### Fast-Forward True Speed Optimisation (2.5x–4.0x)
          - **Overworld D-pad unthrottling**: Bypassed the 250ms direction change throttle when moving in the overworld, ensuring holding ZR while moving with the D-pad runs at true accelerated speed instead of dropping to 1.0x.
          - **Raised Switch fast-forward speed clamp**: Updated the hardware clamp from 2–3x to 2–4x (defaulting to 3x).
          - **Redundant 3D GPU render skipping**: Added `rc_wide_publish_only` to publish widescreen front buffers without queueing redundant GPU draws on hidden frames, skipped `WideOnFlush` thread overhead on skipped frames, and skipped unchanged 256x192 DS 3D GPU passes.

          ### Installation & Updating
          - **From console:** Open \`SETTINGS (Y)\` -> \`CHECK FOR UPDATES\` and press \`A\` to install.
          - **Manual install:** Extract \`nosplitnx-switch.zip\` to the root of your microSD card (\`sdmc:/switch/nosplitnx/nosplitnx.nro\`) and place your ROMs in \`sdmc:/switch/nosplitnx/roms/\`.
          EOF
          echo "" >> build-sd/RELEASE_NOTES.md
          echo "### Checksums (\`SHA256SUMS.txt\`)" >> build-sd/RELEASE_NOTES.md
          echo "\`\`\`text" >> build-sd/RELEASE_NOTES.md
          cat build-sd/SHA256SUMS.txt >> build-sd/RELEASE_NOTES.md
          echo "\`\`\`" >> build-sd/RELEASE_NOTES.md

      - name: Create GitHub Release for Beta Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: "NoSplitNX ${{ github.ref_name }}"
          body_path: build-sd/RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            build-sd/nosplitnx-switch.zip
            build-sd/SHA256SUMS.txt
