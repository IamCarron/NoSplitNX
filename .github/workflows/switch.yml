# Builds the Nintendo Switch homebrew packages (.nro in zip archives) using devkitPro's
# official devkita64 Docker image.
#
# No commercial ROMs or copyright game code are embedded; tables contain addresses and symbols only.
# Manual run: Actions tab -> Nintendo Switch builds -> Run workflow.
name: Nintendo Switch builds

on:
  push:
    branches: [ main ]
    tags: [ 'v*', 'beta*' ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Package to build'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'bw'
          - 'platinum'
          - 'everything'

permissions:
  contents: write

jobs:
  switch-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git python3

      - name: Build all-in-one NoSplitNX (nosplitnx.nro)
        if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'everything'
        run: |
          bash tools/switch/build_game.sh all

      - name: Build standalone Black & White / Black 2 & White 2
        if: github.event.inputs.target == 'bw' || github.event.inputs.target == 'everything'
        run: |
          bash tools/switch/build_game.sh bw

      - name: Build standalone Platinum
        if: github.event.inputs.target == 'platinum' || github.event.inputs.target == 'everything'
        run: |
          bash tools/switch/build_game.sh platinum

      - name: Upload NoSplitNX package
        if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'everything'
        uses: actions/upload-artifact@v4
        with:
          name: nosplitnx-switch
          path: |
            build-sd/nosplitnx-switch.zip
            build-sd/SHA256SUMS.txt
          if-no-files-found: warn

      - name: Upload standalone Black & White 1 & 2 NROs
        if: github.event.inputs.target == 'bw' || github.event.inputs.target == 'everything'
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-bw-standalone-switch
          path: |
            build-sd/pokemon-black2-white2-wide-switch.zip
            build-sd/pokemon-black-white-wide-switch.zip
          if-no-files-found: warn

      - name: Upload standalone Platinum NRO
        if: github.event.inputs.target == 'platinum' || github.event.inputs.target == 'everything'
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-platinum-standalone-switch
          path: build-sd/pokemon-platinum-wide-switch.zip
          if-no-files-found: warn

      - name: Generate Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cat << 'EOF' > build-sd/RELEASE_NOTES.md
          # 🎮 NoSplitNX v1.0.0-beta.3 — Nintendo Switch Release

          Esta versión **Beta 3** soluciona los problemas críticos reportados en la Beta 2: corrige la persistencia y cambio de colores en el lanzador, optimiza la tasa de cuadros y el audio en las pantallas de inicio/carga (eliminando el bajón a 30 FPS y el tartamudeo) y arregla el bloqueo/cierre crítico al salir de casas hacia el overworld en Pokémon Blanco y Negro.

          ---

          ## 🆚 Novedades y Correcciones: Beta 3 vs Beta 2 vs Beta 1

          | Área | Beta 1 | Beta 2 | Beta 3 (`v1.0.0-beta.3`) |
          |---|---|---|---|
          | **Temas y Colores del Launcher** | Cajas rectangulares básicas, paleta fija. | Nuevo diseño Horizon OS, pero los colores no guardaban en tarjetas SD FAT32 de Switch. | **Persistencia inmediata y fiable**: los cambios de color de acento (`COLOUR` / `list_colour`) se guardan de forma instantánea en microSD FAT32 y se reflejan en tiempo real en tarjetas, pestañas y líneas. |
          | **Pantallas de Carga, Título e Intro** | 60 FPS básicos sin optimizaciones panorámicas. | Caída a 30 FPS en la pantalla de carga e intro con audio robotizado/tartamudeando. | **60 FPS fluidos y audio limpio**: se omite el renderizado 3D panorámico innecesario en pantallas 2D (`skipWide`), se calibra la resolución por defecto a 384 líneas con auto-detalle y se estabiliza el búfer de audio WSOLA. |
          | **Transición de Interiores a Overworld (Casas/Edificios)** | Estable en configuraciones estándar. | Crasheo inmediato al salir de una casa hacia el mapa exterior en Pokémon Blanco/Negro. | **Estabilidad 100%**: se libera y recrea limpiamente la memoria de compresión de textura de `deko3D` (`FreeTargets()`) al cambiar de dimensiones entre interiores y overworld, con esperas de cola GPU antes de destruir memoria y comprobación de límites. |
          | **Diseño del Launcher y Menús** | Cuadrado, plano, texto solapado. | Horizon OS con tarjetas redondeadas, sombras y reloj sin solapes. | **Horizon OS refinado**: todos los estilos visuales modernos de la Beta 2 con respuesta en tiempo real a los cambios de color y opciones. |
          | **Actualizador en Consola (Updater)** | No funcionaba. | Funcionamiento restaurado para buscar betas en GitHub y verificar SHA-256. | **Actualización directa en caliente**: abre `SETTINGS (Y)` -> `CHECK FOR UPDATES` en tu Switch para actualizar directamente a Beta 3 conservando tus ROMs, partidas y ajustes. |

          ---

          ## 📦 Instalación y Actualización en Nintendo Switch

          1. **Actualización automática (Recomendada):** En tu Nintendo Switch con NoSplitNX Beta 1 o Beta 2, pulsa `Y` para abrir Ajustes y selecciona `CHECK FOR UPDATES`. La consola descargará e instalará automáticamente la Beta 3 reiniciando en la nueva versión.
          2. **Instalación manual:** Descarga `nosplitnx-switch.zip`, descomprímelo en la raíz de tu tarjeta microSD (`sdmc:/switch/nosplitnx/nosplitnx.nro`) y coloca tus ROMs en `sdmc:/switch/nosplitnx/roms/`.
          EOF
          echo "" >> build-sd/RELEASE_NOTES.md
          echo "### 🔒 SHA-256 Checksum (\`SHA256SUMS.txt\`)" >> build-sd/RELEASE_NOTES.md
          echo "\`\`\`text" >> build-sd/RELEASE_NOTES.md
          cat build-sd/SHA256SUMS.txt >> build-sd/RELEASE_NOTES.md
          echo "\`\`\`" >> build-sd/RELEASE_NOTES.md

      - name: Create GitHub Release for Beta Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: "NoSplitNX ${{ github.ref_name }}"
          body_path: build-sd/RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            build-sd/nosplitnx-switch.zip
            build-sd/SHA256SUMS.txt
