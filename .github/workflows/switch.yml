# Builds the Nintendo Switch homebrew packages (.nro in zip archives) using devkitPro's
# official devkita64 Docker image.
#
# No commercial ROMs or copyright game code are embedded; tables contain addresses and symbols only.
# Manual run: Actions tab -> Nintendo Switch builds -> Run workflow.
name: Nintendo Switch builds

on:
  push:
    branches: [ main ]
    tags: [ 'v*', 'beta*' ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Package to build'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'bw'
          - 'platinum'
          - 'everything'

permissions:
  contents: write

jobs:
  switch-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git python3

      - name: Build all-in-one NoSplitNX (nosplitnx.nro)
        if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'everything'
        run: |
          bash tools/switch/build_game.sh all

      - name: Build standalone Black & White / Black 2 & White 2
        if: github.event.inputs.target == 'bw' || github.event.inputs.target == 'everything'
        run: |
          bash tools/switch/build_game.sh bw

      - name: Build standalone Platinum
        if: github.event.inputs.target == 'platinum' || github.event.inputs.target == 'everything'
        run: |
          bash tools/switch/build_game.sh platinum

      - name: Upload NoSplitNX package
        if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'everything'
        uses: actions/upload-artifact@v4
        with:
          name: nosplitnx-switch
          path: |
            build-sd/nosplitnx-switch.zip
            build-sd/SHA256SUMS.txt
          if-no-files-found: warn

      - name: Upload standalone Black & White 1 & 2 NROs
        if: github.event.inputs.target == 'bw' || github.event.inputs.target == 'everything'
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-bw-standalone-switch
          path: |
            build-sd/pokemon-black2-white2-wide-switch.zip
            build-sd/pokemon-black-white-wide-switch.zip
          if-no-files-found: warn

      - name: Upload standalone Platinum NRO
        if: github.event.inputs.target == 'platinum' || github.event.inputs.target == 'everything'
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-platinum-standalone-switch
          path: build-sd/pokemon-platinum-wide-switch.zip
          if-no-files-found: warn

      - name: Generate Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cat << EOF > build-sd/RELEASE_NOTES.md
          # NoSplitNX ${{ github.ref_name }}

          This release fixes a crash on Nintendo Switch when stepping out through doors or transitions into the outdoor overworld, resolves the stack buffer overflow in polygon clipping, eliminates the candidate search stall on large overworld scenes, and prevents crashes when toggling 60 FPS interpolation.

          ### Fixes & Improvements

          - **Door Exit & Outdoor Overworld Crash**: Fixed stack buffer overflow in `ClipAgainstPlane` where clipping complex outdoor overworld geometry (up to 2,656 polygons) generated $\ge 10$ vertices, overflowing the 10-vertex stack array and tripping GCC's stack protector (`__stack_chk_fail`).
          - **Candidate Stall Elimination**: Optimized `ExtendToEdges` by reordering 2D bounding-box and depth rejection before `sharesCorner`, eliminating up to 7 million expensive corner tests and preventing CPU watchdog freezes when entering large maps.
          - **Safe 60 FPS Interpolation Toggle**: Toggling 60 FPS in the pause menu mid-dialogue or during static scenes now safely resets `RawCurrent`, `RawPrevious`, and all pending interpolation queues, eliminating crashes from stale polygon pointers.
          - **Deko3D Memory Cleanup**: Ensured `FreeTargets()` is cleanly called on dimension changes in `MakeTargets` to reallocate Tegra X1 texture memory with proper alignment and compression metadata.
          - **Arithmetic Safety**: Added divide-by-zero protection in `ClipSegment` when vertices share identical plane distance.
          - **Launcher Theme Persistence**: Settings and accent color changes save immediately on Switch FAT32 SD cards.
          - **In-Console Updater**: Fully functional update path via `SETTINGS (Y)` -> `CHECK FOR UPDATES`.

          ### Installation & Updating

          - **From console:** Open \`SETTINGS (Y)\` -> \`CHECK FOR UPDATES\` and press \`A\` to install.
          - **Manual install:** Extract \`nosplitnx-switch.zip\` to the root of your microSD card (\`sdmc:/switch/nosplitnx/nosplitnx.nro\`) and place your ROMs in \`sdmc:/switch/nosplitnx/roms/\`.
          EOF
          echo "" >> build-sd/RELEASE_NOTES.md
          echo "### Checksums (\`SHA256SUMS.txt\`)" >> build-sd/RELEASE_NOTES.md
          echo "\`\`\`text" >> build-sd/RELEASE_NOTES.md
          cat build-sd/SHA256SUMS.txt >> build-sd/RELEASE_NOTES.md
          echo "\`\`\`" >> build-sd/RELEASE_NOTES.md

      - name: Create GitHub Release for Beta Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: "NoSplitNX ${{ github.ref_name }}"
          body_path: build-sd/RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            build-sd/nosplitnx-switch.zip
            build-sd/SHA256SUMS.txt
