# Builds the Nintendo Switch homebrew packages (.nro in zip archives) using devkitPro's
# official devkita64 Docker image.
#
# No commercial ROMs or copyright game code are embedded; tables contain addresses and symbols only.
# Manual run: Actions tab -> Nintendo Switch builds -> Run workflow.
name: Nintendo Switch builds

on:
  push:
    branches: [ main ]
    tags: [ 'v*', 'beta*' ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Package to build'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'bw'
          - 'platinum'
          - 'everything'

permissions:
  contents: write

jobs:
  switch-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git python3

      - name: Build all-in-one NoSplitNX (nosplitnx.nro)
        if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'everything'
        run: |
          bash tools/switch/build_game.sh all

      - name: Build standalone Black & White / Black 2 & White 2
        if: github.event.inputs.target == 'bw' || github.event.inputs.target == 'everything'
        run: |
          bash tools/switch/build_game.sh bw

      - name: Build standalone Platinum
        if: github.event.inputs.target == 'platinum' || github.event.inputs.target == 'everything'
        run: |
          bash tools/switch/build_game.sh platinum

      - name: Upload NoSplitNX package
        if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'everything'
        uses: actions/upload-artifact@v4
        with:
          name: nosplitnx-switch
          path: |
            build-sd/nosplitnx-switch.zip
            build-sd/SHA256SUMS.txt
          if-no-files-found: warn

      - name: Upload standalone Black & White 1 & 2 NROs
        if: github.event.inputs.target == 'bw' || github.event.inputs.target == 'everything'
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-bw-standalone-switch
          path: |
            build-sd/pokemon-black2-white2-wide-switch.zip
            build-sd/pokemon-black-white-wide-switch.zip
          if-no-files-found: warn

      - name: Upload standalone Platinum NRO
        if: github.event.inputs.target == 'platinum' || github.event.inputs.target == 'everything'
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-platinum-standalone-switch
          path: build-sd/pokemon-platinum-wide-switch.zip
          if-no-files-found: warn

      - name: Generate Release Notes (Beta 2 vs Beta 1)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          SUM=$(cat build-sd/SHA256SUMS.txt | awk '{print $1}')
          cat << 'EOF' > build-sd/RELEASE_NOTES.md
          # 🎮 NoSplitNX v1.0.0-beta.2 — Nintendo Switch Release

          Esta versión **Beta 2** supone un salto enorme respecto a la **Beta 1 (`v1.0.0-beta.1`)**, rediseñando por completo la interfaz gráfica de la aplicación al estilo Horizon OS, reparando el auto-actualizador integrado en la consola y optimizando el motor 3D/2D y el audio para mantener **60 FPS estables a 720p** sin tirones ni recortes visuales.

          ---

          ## 🆚 Comparativa Completa: Beta 2 vs Beta 1

          | Área | Beta 1 (`v1.0.0-beta.1`) | Beta 2 (`v1.0.0-beta.2`) |
          |---|---|---|
          | **Interfaz del Lanzador (Launcher)** | Cajas rectangulares planas, texto `SETTINGS (Y)` solapado encima del reloj y modo `HANDHELD`/`TV` en la esquina superior derecha. | **Diseño moderno estilo Horizon OS**: tarjetas redondeadas con sombra suave y degradado vertical, cuna interior para iconos DS, insignias `NDS`/`GBA` y píldoras de estado (`SAVE FOUND` en verde esmeralda, `NEW GAME` en ámbar). El reloj y `HANDHELD`/`DOCKED` van en píldoras a la izquierda y `SETTINGS (Y)` a la derecha sin solaparse. |
          | **Menú de Ajustes y Pausa** | Bloques planos con bordes cuadrados (`Fill`), barra de volumen rectangular simple y notificaciones pegadas al borde. | **Modales y tarjetas redondeadas (`FillRound` / `FillGradV` / `OutlineRound`)** con sombra proyectada, barra de acento lateral en la fila activa, control de volumen con segmentos redondeados y notificaciones/FPS en píldoras flotantes con código de color (`>=55 FPS` verde, `>=40 FPS` ámbar, `<40 FPS` coral). |
          | **Auto-Actualizador en Switch (`Updater`)** | No funcionaba: fallaba la verificación SSL de `libcurl` en Horizon OS, ignoraba versiones `prerelease` (betas), el workflow no subía `SHA256SUMS.txt` y `romfsInit()` bloqueaba el reemplazo de `nosplitnx.nro`. | **100% funcional desde la propia Switch**: soporte HTTPS en Horizon OS, detección de betas/prereleases, publicación y verificación criptográfica contra `SHA256SUMS.txt`, desmontaje limpio de `romfs` antes de actualizar `nosplitnx.nro` y reinicio directo a la nueva versión conservando partidas y ajustes. |
          | **Rendimiento 3D / GPU (`deko3D`)** | Caídas a 29–40 FPS en exteriores con partículas/clima en *Black/White/Black 2/White 2*; resolución interna reducida por defecto a `540p`. | **60 FPS constantes a `720p` nativos por defecto**: texturas 3D cacheadas por frame en `GPU3D_WideGpu.cpp` (evita re-decodificar VRAM en el hilo de emulación), emparejamiento O(1) por *spatial-hash* para interpolación a 60 FPS (`GPU3D_Wide.cpp`) y unificación de `WaitList` y `WideWait`. |
          | **Composición en Pantalla Única (Gen 4 y Gen 5)** | Guardado/Diario cortado en Gen 5, tarjetas del Videomisor/Bolsa solapadas, menú X descentrado y cursor táctil fantasma en combates. | **Vistas de pantalla única corregidas**: tarjeta superior e inferior visibles al guardar en Gen 5, detección universal para los 7 idiomas en Bolsa/Videomisor, menú X flotante en la esquina inferior derecha y ocultación automática del cursor táctil cuando no se mueve el stick derecho. |
          | **Audio y Ciclos CPU (Gen 5)** | Audio acelerado/entrecortado al bajar de 60 FPS y `ShiftWRAM` lento al cambiar de mapa. | **Audio limpio con *time-stretching* por bloques** (preserva el tono sin chasquidos), *fast-path* de 64 bits en `ShiftWRAM` y divisores de ciclos ARM9/ARM7 ajustados para Gen 5. |

          ---

          ## 📦 Instalación y Actualización en Nintendo Switch

          1. **Desde el actualizador integrado:** Si ya tienes NoSplitNX, abre `SETTINGS (Y)` -> `CHECK FOR UPDATES` para descargar e instalar automáticamente la Beta 2.
          2. **Instalación manual:** Descarga `nosplitnx-switch.zip`, extráelo en la raíz de tu tarjeta microSD (`sdmc:/switch/nosplitnx/nosplitnx.nro`) y coloca tus ROMs en `sdmc:/switch/nosplitnx/roms/`.
          EOF
          echo "" >> build-sd/RELEASE_NOTES.md
          echo "### 🔒 SHA-256 Checksum (\`SHA256SUMS.txt\`)" >> build-sd/RELEASE_NOTES.md
          echo "\`\`\`text" >> build-sd/RELEASE_NOTES.md
          cat build-sd/SHA256SUMS.txt >> build-sd/RELEASE_NOTES.md
          echo "\`\`\`" >> build-sd/RELEASE_NOTES.md

      - name: Create GitHub Release for Beta Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: "NoSplitNX ${{ github.ref_name }}"
          body_path: build-sd/RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            build-sd/nosplitnx-switch.zip
            build-sd/SHA256SUMS.txt
