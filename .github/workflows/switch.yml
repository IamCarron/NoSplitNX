# Builds the Nintendo Switch homebrew packages (.nro in zip archives) using devkitPro's
# official devkita64 Docker image.
#
# No commercial ROMs or copyright game code are embedded; tables contain addresses and symbols only.
# Manual run: Actions tab -> Nintendo Switch builds -> Run workflow.
name: Nintendo Switch builds

on:
  push:
    branches: [ main ]
    tags: [ 'v*', 'beta*' ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Package to build'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'bw'
          - 'platinum'
          - 'everything'

permissions:
  contents: write

jobs:
  switch-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git python3

      - name: Build all-in-one NoSplitNX (nosplitnx.nro)
        if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'everything'
        run: |
          bash tools/switch/build_game.sh all

      - name: Build standalone Black & White / Black 2 & White 2
        if: github.event.inputs.target == 'bw' || github.event.inputs.target == 'everything'
        run: |
          bash tools/switch/build_game.sh bw

      - name: Build standalone Platinum
        if: github.event.inputs.target == 'platinum' || github.event.inputs.target == 'everything'
        run: |
          bash tools/switch/build_game.sh platinum

      - name: Upload NoSplitNX package
        if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'everything'
        uses: actions/upload-artifact@v4
        with:
          name: nosplitnx-switch
          path: |
            build-sd/nosplitnx-switch.zip
            build-sd/SHA256SUMS.txt
          if-no-files-found: warn

      - name: Upload standalone Black & White 1 & 2 NROs
        if: github.event.inputs.target == 'bw' || github.event.inputs.target == 'everything'
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-bw-standalone-switch
          path: |
            build-sd/pokemon-black2-white2-wide-switch.zip
            build-sd/pokemon-black-white-wide-switch.zip
          if-no-files-found: warn

      - name: Upload standalone Platinum NRO
        if: github.event.inputs.target == 'platinum' || github.event.inputs.target == 'everything'
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-platinum-standalone-switch
          path: build-sd/pokemon-platinum-wide-switch.zip
          if-no-files-found: warn

      - name: Generate Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cat << EOF > build-sd/RELEASE_NOTES.md
          # NoSplitNX ${{ github.ref_name }}

          This release fixes the critical door exit crash in Pokémon Black and White by ensuring strict 64 KB Tegra X1 hardware alignment on compressed render targets in deko3D, resolves fast-forward performance stalls, and streamlines the interface by removing redundant settings.

          ### Door Crash & Tegra X1 Hardware Alignment Fix
          - **Hardware-aligned deko3D render targets**: Maxwell Tegra X1 compressed render targets (`DkImageFlags_HwCompression`) require 64 KB base address alignment. Allocated memory is now offset to exact alignment `(align - (base % align)) % align` rather than 0, completely resolving the MMU page fault and crash when walking through doors into the outdoor overworld.
          - **Guarded pitch-linear targets**: `SlotImage` validates memory alignment and safely falls back to final pass blits if unaligned.
          - **GPU Send Join & Publish Protection**: Only joins completed GPU fetch tasks and avoids publishing stale or unsubmitted frame buffers.
          - **Safe Map Loading Default**: `wideMap` defaulted to `false` to avoid zone memory layout modification on transitions.

          ### Fast Forward Performance Fix (No More 10 FPS Drop)
          - **Unthrottled frame pacing**: Removed 60 Hz wall-clock timer sleeps during fast forward (`speed > 1`), allowing frames to advance as fast as the hardware can process them.
          - **Dynamic 192p wide resolution**: During fast forward, wide 3D GPU lines drop to 192p (native DS height), reducing fillrate bottlenecks by ~14x. Full sharpness is restored immediately when fast forward ends.
          - **Skip intermediate 3D rendering**: Intermediate emulation steps skip heavy wide 3D GPU passes entirely (`rc_wide_render_skip`), rendering only the final displayed frame.
          - **Lightweight audio backlog**: Capped fast-forward audio buffer to 2 seconds instead of 30 seconds, eliminating multi-megabyte `vector::erase` memory copies every few frames.

          ### Streamlined Settings & Interface
          - Removed clutter and unstable settings from the Launcher and Pause menus (`wide_map`, `battle_buttons`, `busy_detail`, `start_button`, `pad_touch`, and non-interactive help cards).
          - Clean, intuitive, and modern Horizon OS interface.

          ### Visual & UX Overhaul (from Beta 8)
          - Dynamic responsive grid with adaptive multi-column layouts.
          - 3D retro cartridge case fallbacks with metallic serial badges (`NTR-` / `AGB-`).
          - Radiant bloom glow, frosted glass cards, and glowing LED hardware status indicators.
          - Tactile 3D controller button badges dock (`[A] PLAY`, `[Y] SETTINGS`, etc.).
          - Horizon OS sliding toggle switches and smooth continuous volume slider bars.

          ### Installation & Updating

          - **From console:** Open \`SETTINGS (Y)\` -> \`CHECK FOR UPDATES\` and press \`A\` to install.
          - **Manual install:** Extract \`nosplitnx-switch.zip\` to the root of your microSD card (\`sdmc:/switch/nosplitnx/nosplitnx.nro\`) and place your ROMs in \`sdmc:/switch/nosplitnx/roms/\`.
          EOF
          echo "" >> build-sd/RELEASE_NOTES.md
          echo "### Checksums (\`SHA256SUMS.txt\`)" >> build-sd/RELEASE_NOTES.md
          echo "\`\`\`text" >> build-sd/RELEASE_NOTES.md
          cat build-sd/SHA256SUMS.txt >> build-sd/RELEASE_NOTES.md
          echo "\`\`\`" >> build-sd/RELEASE_NOTES.md

      - name: Create GitHub Release for Beta Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: "NoSplitNX ${{ github.ref_name }}"
          body_path: build-sd/RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            build-sd/nosplitnx-switch.zip
            build-sd/SHA256SUMS.txt
