<?xml version="1.0" encoding="UTF-8"?>
<!-- NoSplitNX app icon: the DS's two screens (faint, behind) joined into one widescreen picture,
     framed by the Switch's blue and red Joy-Con colours. tools/switch/icon.jpg (the Homebrew Menu
     icon, 256x256 JPEG) is rendered from this file. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2a4a"/>
      <stop offset="1" stop-color="#0b1122"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#5b7bd6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5b7bd6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc8ff"/>
      <stop offset="0.62" stop-color="#bfe6ff"/>
      <stop offset="0.62" stop-color="#5cc46a"/>
      <stop offset="1" stop-color="#2f8f4a"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f8fb8"/>
      <stop offset="1" stop-color="#4a6a94"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="40" y="86" width="176" height="99" rx="7"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="url(#bg)"/>
  <rect width="256" height="256" fill="url(#glow)"/>

  <!-- Two stacked DS screens becoming one wide screen -->
  <g fill="none" stroke="#c9d6f5" stroke-width="2.5" opacity="0.75">
    <rect x="86" y="24" width="30" height="19" rx="3"/>
    <rect x="86" y="47" width="30" height="19" rx="3"/>
    <rect x="140" y="32" width="38" height="22" rx="3"/>
  </g>
  <path d="M122 45 H132 M128 40 L134 45 L128 50" fill="none" stroke="#c9d6f5" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>

  <!-- Joy-Con coloured sides -->
  <rect x="18" y="80" width="26" height="111" rx="12" fill="#00b8e6"/>
  <rect x="212" y="80" width="26" height="111" rx="12" fill="#ff4b55"/>
  <circle cx="31" cy="110" r="5.5" fill="#0b1122" opacity="0.55"/>
  <circle cx="225" cy="160" r="5.5" fill="#0b1122" opacity="0.55"/>

  <!-- The one widescreen picture -->
  <rect x="34" y="80" width="188" height="111" rx="11" fill="#0b1122"/>
  <g clip-path="url(#screen)">
    <rect x="40" y="86" width="176" height="99" fill="url(#sky)"/>
    <path d="M40 148 Q72 118 104 140 T168 132 T216 140 V148 H40 Z" fill="url(#hill)" opacity="0.8"/>
    <rect x="40" y="147" width="176" height="38" fill="#4fb35f"/>
    <path d="M40 160 H216 M40 172 H216" stroke="#3f9a50" stroke-width="2"/>
    <!-- Ball in the middle, where the screens used to split -->
    <g transform="translate(128 136)">
      <circle r="27" fill="#f4f6fb"/>
      <path d="M-27 0 A27 27 0 0 1 27 0 Z" fill="#ef3b45"/>
      <rect x="-27" y="-3" width="54" height="6" fill="#1b2236"/>
      <circle r="10" fill="#1b2236"/>
      <circle r="6" fill="#f4f6fb"/>
      <circle r="27" fill="none" stroke="#1b2236" stroke-width="4"/>
      <ellipse cx="-11" cy="-15" rx="7" ry="4" fill="#ffffff" opacity="0.55" transform="rotate(-30 -11 -15)"/>
    </g>
  </g>
  <rect x="34" y="80" width="188" height="111" rx="11" fill="none" stroke="#e8eeff" stroke-width="2.5" opacity="0.9"/>

  <!-- Name -->
  <text x="128" y="226" text-anchor="middle" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif"
        font-size="30" font-weight="800" fill="#ffffff" letter-spacing="0.5">NoSplit<tspan fill="#ff4b55">NX</tspan></text>
</svg>
