<?xml version="1.0" encoding="UTF-8"?>
<!-- NoSplitNX app icon: neutral graphite-charcoal background with crimson-red and warm-white
     16:9 fused-screen emblem. tools/switch/icon.jpg (256x256 JPEG) is rendered from this design. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1e24"/>
      <stop offset="1" stop-color="#111216"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.44" r="0.58">
      <stop offset="0" stop-color="#dc2626" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screenBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23262f"/>
      <stop offset="1" stop-color="#171920"/>
    </linearGradient>
  </defs>

  <!-- Graphite charcoal background -->
  <rect width="256" height="256" fill="url(#bg)"/>
  <rect width="256" height="256" fill="url(#glow)"/>

  <!-- Subtle outer card frame -->
  <rect x="16" y="16" width="224" height="224" rx="36" fill="none" stroke="#2d3039" stroke-width="2"/>

  <!-- Two stacked screens merging into one 16:9 widescreen (top indicator) -->
  <g fill="none" stroke="#a0a6b8" stroke-width="2.5" opacity="0.85">
    <rect x="84" y="28" width="28" height="17" rx="3"/>
    <rect x="84" y="49" width="28" height="17" rx="3"/>
    <rect x="140" y="35" width="38" height="23" rx="3" stroke="#dc2626"/>
  </g>
  <path d="M119 47 H131 M127 42 L133 47 L127 52" fill="none" stroke="#f4f5f8" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left and right crimson/slate controller rails -->
  <rect x="24" y="82" width="18" height="104" rx="9" fill="#dc2626"/>
  <rect x="214" y="82" width="18" height="104" rx="9" fill="#383c47"/>

  <!-- Unified 16:9 Widescreen Frame -->
  <rect x="36" y="78" width="184" height="112" rx="14" fill="url(#screenBg)" stroke="#f4f5f8" stroke-width="3"/>

  <!-- Split-to-wide fused screen interior geometry -->
  <rect x="48" y="90" width="102" height="88" rx="7" fill="#dc2626" fill-opacity="0.18" stroke="#dc2626" stroke-width="2"/>
  <rect x="158" y="90" width="50" height="41" rx="6" fill="#f4f5f8" fill-opacity="0.10" stroke="#a0a6b8" stroke-width="2"/>
  <rect x="158" y="137" width="50" height="41" rx="6" fill="#f4f5f8" fill-opacity="0.10" stroke="#a0a6b8" stroke-width="2"/>

  <!-- 16:9 badge inside primary viewport -->
  <rect x="74" y="120" width="50" height="28" rx="6" fill="#dc2626"/>
  <text x="99" y="140" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif"
        font-size="16" font-weight="800" fill="#ffffff">16:9</text>

  <!-- Title -->
  <text x="128" y="226" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif"
        font-size="29" font-weight="800" fill="#f4f5f8" letter-spacing="0.5">NoSplit<tspan fill="#dc2626">NX</tspan></text>
</svg>
